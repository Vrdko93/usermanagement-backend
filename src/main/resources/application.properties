spring.application.name=user-management
server.port=8080

# ============================================
# DATABASE (PostgreSQL)
# On EC2, set DB_HOST to the PRIVATE IP of the database instance before starting:
#   export DB_HOST=172.31.x.x
# Defaults below match the Day 1 setup (database userdb, user appuser).
# ============================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:userdb}
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD:appuser123}

# Create / update the USERS table automatically from the User entity
spring.jpa.hibernate.ddl-auto=update

# Print the SQL Hibernate runs (useful for learning)
spring.jpa.show-sql=true

# Profile pictures: private S3 bucket; IAM instance role supplies credentials
photo.bucket=${PHOTO_BUCKET_NAME:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Redis connection (localhost on backend EC2)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Use Redis, not an in-memory cache
spring.cache.type=redis
spring.cache.cache-names=users

# Cached entries expire after 5 minutes
spring.cache.redis.time-to-live=300000
spring.cache.redis.cache-null-values=false
